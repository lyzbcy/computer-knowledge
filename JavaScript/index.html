<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript · 刷题学习地图</title>
<style>
:root{
  --cream:#FAF6EB;--paper:#F3EDDD;--forest:#1E3A24;--sky:#BCD8EE;
  --sage:#AFCDA8;--ink:#1A2018;--marker:#F5E08A;--brick:#B5482A;
  --js:#F7DF1E;--js-deep:#C9B400;
  --font-display:"Archivo Black","Noto Sans SC","PingFang SC",sans-serif;
  --font-head:"Poppins","Noto Sans SC","PingFang SC",sans-serif;
  --font-body:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);background:var(--cream);color:var(--ink);
  line-height:1.7;min-height:100vh;
}
a{color:var(--brick);text-decoration:underline;}

/* ============ hero ============ */
.hero{
  background:linear-gradient(135deg,var(--forest) 0%,#264a2e 100%);color:#EAF3E6;
  padding:44px 24px 36px;text-align:center;
}
.hero .badge{
  display:inline-block;background:#FFF9D0;color:#6a5a00;
  font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:999px;
  letter-spacing:1px;margin-bottom:12px;border:1.5px solid var(--js);
}
.hero h1{font-family:var(--font-display);font-size:1.9rem;color:#fff;letter-spacing:.5px;margin-bottom:8px;}
.hero p{color:#CFE3C7;font-size:.92rem;max-width:560px;margin:0 auto;}
.hero .stat{font-family:monospace;color:var(--js);}

/* ============ 主体 ============ */
.wrap{max-width:980px;margin:0 auto;padding:32px 20px 80px;}
.back{
  display:inline-flex;align-items:center;gap:5px;
  color:var(--forest);font-weight:600;font-size:.88rem;text-decoration:none;
  margin-bottom:22px;padding:7px 14px;background:var(--paper);border-radius:999px;
  border:1.5px solid var(--sage);
}
.back:hover{background:var(--sage);color:#fff;}

.sec-head{
  font-family:var(--font-head);font-size:1.2rem;color:var(--forest);
  margin:28px 0 4px;display:flex;align-items:center;gap:8px;
}
.sec-sub{color:#7A6E54;font-size:.84rem;margin-bottom:18px;}

/* ============ 题目橱窗网格（购物平台式）============ */
.shop{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:14px;
}
.shop-item{
  background:#fff;border:1px solid #E6DCC2;border-radius:12px;
  padding:16px 14px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;border-top:4px solid var(--js-deep);
  position:relative;
}
.shop-item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,58,36,.12);}
.shop-item .num{
  font-family:var(--font-display);font-size:.86rem;color:#1a1a1a;
  background:var(--js);padding:2px 9px;border-radius:6px;align-self:flex-start;
  margin-bottom:8px;font-weight:900;
}
.shop-item .ttl{font-family:var(--font-head);font-size:.92rem;color:var(--forest);font-weight:700;line-height:1.35;margin-bottom:6px;}
.shop-item .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.shop-item .tags span{font-size:.64rem;font-family:monospace;background:#FFF9D0;color:#6a5a00;padding:1px 6px;border-radius:999px;}
.shop-item .date{font-size:.7rem;color:#9A8E70;margin-top:auto;font-family:monospace;}
.shop-item .arrow{position:absolute;bottom:10px;right:12px;color:var(--js-deep);font-size:.8rem;font-weight:700;}

/* ============ 详情 Modal ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,30,18,.55);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:40px 16px;
  overflow-y:auto;
}
.modal-mask.open{display:flex;}
.modal{
  background:var(--cream);border-radius:16px;max-width:720px;width:100%;
  margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:6px solid var(--js);
  overflow:hidden;
}
.modal-head{
  padding:20px 24px 16px;background:var(--paper);
  display:flex;align-items:center;gap:14px;border-bottom:1px solid #E6DCC2;position:sticky;top:0;z-index:2;
}
.modal-num{
  font-family:var(--font-display);font-size:.9rem;color:#1a1a1a;background:var(--js);
  padding:4px 12px;border-radius:8px;font-weight:900;flex-shrink:0;
}
.modal-title{font-family:var(--font-head);font-size:1.1rem;color:var(--forest);font-weight:700;flex:1;}
.modal-close{
  width:34px;height:34px;border:0;border-radius:50%;cursor:pointer;
  background:var(--forest);color:#fff;font-size:1.2rem;line-height:1;flex-shrink:0;
}
.modal-close:hover{background:#16301D;}
.modal-body{padding:20px 24px 28px;max-height:calc(100vh - 180px);overflow-y:auto;overscroll-behavior:contain;}
.modal-body h4{
  font-family:var(--font-head);font-size:.95rem;color:var(--js-deep);
  margin:18px 0 8px;padding-bottom:4px;border-bottom:1.5px dashed #F0E8A0;
}
.modal-body h4:first-child{margin-top:0;}
.modal-body p{font-size:.88rem;color:#3a342a;margin-bottom:8px;}
.modal-body ul,.modal-body ol{margin:0 0 10px 22px;font-size:.86rem;color:#3a342a;}
.modal-body li{margin-bottom:4px;}
.modal-body strong{color:var(--forest);}

pre{
  background:#1E2820;color:#D4E8D0;border-radius:10px;padding:14px 16px;
  overflow-x:auto;font-family:var(--font-mono);font-size:.8rem;line-height:1.6;
  margin:10px 0;border:1px solid #2a3a2e;
}
pre code{background:none;padding:0;color:inherit;}
code{background:var(--paper);padding:2px 6px;border-radius:4px;font-family:var(--font-mono);font-size:.8rem;color:var(--brick);}

.pit{background:#FFF3E0;border:1.5px solid #F0C674;border-radius:10px;padding:11px 15px;font-size:.84rem;color:#6a4a00;margin:10px 0;}
.pit b{color:var(--brick);} .pit ul{margin:6px 0 0 18px;}
.gain{background:#EEF3E8;border-left:4px solid var(--sage);border-radius:10px;padding:11px 15px;font-size:.84rem;color:#3a4a34;margin:10px 0;}
.gain b{color:#2F7D46;} .gain ul{margin:6px 0 0 18px;}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.82rem;background:var(--cream);border-radius:8px;overflow:hidden;}
.tbl th{background:var(--js-deep);color:#fff;padding:7px 9px;text-align:left;font-size:.76rem;}
.tbl td{padding:7px 9px;border-bottom:1px solid #E0D8C0;} .tbl tr:last-child td{border:none;}
.sol-link{display:inline-block;margin:6px 0 0;font-size:.8rem;color:var(--brick);}

footer{text-align:center;padding:24px;font-size:.8rem;color:#7A6E54;}

@media(max-width:680px){
  .hero h1{font-size:1.5rem;}
  .shop{grid-template-columns:repeat(2,1fr);gap:10px;}
  .shop-item{padding:13px 11px 11px;}
  .shop-item .ttl{font-size:.84rem;}
  .modal-mask{padding:20px 10px;}
  .modal-body{padding:16px 16px 24px;}
  pre{font-size:.74rem;}
}
</style>
</head>
<body>

<section class="hero">
  <span class="badge">🟡 前端语言</span>
  <h1>JavaScript · 刷题学习地图</h1>
  <p>用 JavaScript 刷 LeetCode，积累语言特性和算法模板。<br>已刷 <span class="stat" id="cnt">…</span> 题，点击卡片查看详情。</p>
</section>

<div class="wrap">
  <a class="back" href="../index.html">← 返回计算机知识</a>

  <div class="sec-head">🛒 题目橱窗</div>
  <p class="sec-sub">点击任意题目卡片，查看完整思路、代码与踩坑记录。</p>

  <div class="shop" id="shop"><!-- JS 动态渲染 --></div>
</div>

<!-- ============ 详情 Modal ============ -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-num" id="mNum"></span>
      <span class="modal-title" id="mTitle"></span>
      <button class="modal-close" id="mClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<footer>JavaScript 刷题学习地图 · 由 <a href="https://lyzbcy.github.io/" target="_blank" rel="noopener">捞鱼</a> 制作</footer>

<script>
// ============ 题目数据（单一数据源）============
var PROBLEMS = [
  {
    num: '9', title: '回文数', date: '2026-08-07',
    tags: ['双指针','回文','类型转换','简单'],
    link: 'https://leetcode.cn/problems/palindrome-number/solutions/4009744/javascript-chang-shi-by-lao-yu-bu-chi-yu-hee6/',
    body:
      '<h4>① 题目理解</h4><p>判断整数 x 是否为回文（正序倒序相同）。负数一定不是。</p>'+
      '<h4>② 思路：转字符串 + 双指针</h4><p>数字不好直接比两端，转字符串后用左右指针向中间扫。</p>'+
      '<h4>③ 踩坑</h4><div class="pit"><b>JS 类型陷阱：</b><ul><li><code>number</code> 没有 <code>.length</code>，要先 <code>String(x)</code></li><li><code>String(x)</code> 返回新字符串，不修改变量</li><li>右指针是 <code>length-1</code> 不是 <code>length</code></li></ul></div>'+
      '<h4>④ 代码</h4><pre><code>var isPalindrome = function(x) {\n    if (x &lt; 0) return false;\n    let y = String(x);\n    let left = 0, right = y.length - 1;\n    while (left &lt; right) {\n        if (y[left] != y[right]) return false;\n        left++; right--;\n    }\n    return true;\n};</code></pre>'+
      '<h4>⑤ 收获 · 双指针模板</h4><div class="gain"><b>回文/对称/两端比较都用：</b><ul><li><code>left=0, right=len-1</code></li><li>不等就 false，相等就 left++/right--</li></ul></div>'
  },
  {
    num: '140', title: '链表倒数第k个节点（LCR 140）', date: '2026-08-07',
    tags: ['链表','快慢指针','双指针','简单'],
    link: 'https://leetcode.cn/problems/lian-biao-zhong-dao-shu-di-kge-jie-dian-lcof/solutions/4007054/di-yi-ci-chang-shi-js-by-lao-yu-bu-chi-y-6jpz/',
    body:
      '<h4>① 题目理解</h4><p>给定单链表 head 和整数 k，返回链表中倒数第 k 个节点。</p>'+
      '<h4>② 思路：快慢指针</h4><ul><li><code>fast</code> 先走 k 步</li><li>然后 <code>fast</code> 和 <code>slow</code> 一起走，fast 到末尾时 slow 正好在倒数第 k 个</li><li>时间 O(n)，空间 O(1)</li></ul>'+
      '<h4>③ 关键点</h4><div class="pit"><b>链表通用套路：</b><ul><li>「倒数第 k 个」= 快指针先走 k 步</li><li>注意边界：k 大于链表长度时 fast 先变 null</li><li>JS 链表是对象 <code>{val, next}</code>，判空 <code>!== null</code></li></ul></div>'+
      '<h4>④ 收获 · 快慢指针家族</h4><div class="gain"><ul><li>倒数第 k 个：fast 先走 k 步</li><li>找中点：fast 走 2 步、slow 走 1 步</li><li>判环：fast 走 2 步、slow 走 1 步，相遇即有环</li></ul></div>'
  },
  {
    num: '997', title: '找到小镇的法官', date: '2026-08-11',
    tags: ['图论','入度出度','数组统计','简单'],
    link: 'https://leetcode.cn/problems/find-the-town-judge/solutions/4010124/javascript-ben-fang-fa-liang-ci-xun-huan-5161/',
    body:
      '<h4>① 题目理解</h4><p>小镇 n 个人，<code>trust[i]=[a,b]</code> 表示 a 信任 b。法官：①不信任任何人 ②除法官外所有人都信任他 ③只有一人满足。找不到返回 -1。</p>'+
      '<h4>② 思路：统计信任分数</h4><p>定义 <code>people[i]</code> 为第 i 人的信任分数：信任别人 -1、被信任 +1。最后找分数 = n-1 的人。</p>'+
      '<h4>③ 代码</h4><pre><code>var findJudge = function(n, trust) {\n    let people = new Array(n + 1).fill(0);\n    for (let [a, b] of trust) {\n        people[a]--;   // a 信任别人\n        people[b]++;   // b 被信任\n    }\n    for (let i = 1; i &lt;= n; i++) {\n        if (people[i] === n - 1) return i;\n    }\n    return -1;\n};</code></pre>'+
      '<h4>④ 本质：有向图入度出度</h4><div class="gain"><b>法官 = 入度 n-1 + 出度 0</b><br>用一个数组同时记录入度(+1)和出度(-1)，比开两个数组更简洁。</div>'+
      '<h4>⑤ 复杂度</h4><p>时间 O(m+n)，空间 O(n)。</p>'
  },
  {
    num: '28', title: '找出字符串第一个匹配项的下标', date: '2026-08-11',
    tags: ['字符串','匹配','双指针','简单'],
    link: '',
    body:
      '<h4>① 题目理解</h4><p>给定 haystack 和 needle，返回 needle 在 haystack 中第一次出现的下标，不存在返回 -1。</p>'+
      '<h4>② 思路：暴力匹配 / 或 KMP</h4><ul><li><b>暴力</b>：从每个位置开始尝试匹配 needle，时间 O(m×n)</li><li><b>KMP</b>：预处理 needle 的前缀函数，时间 O(m+n)，进阶解法</li></ul>'+
      '<h4>③ 暴力代码</h4><pre><code>var strStr = function(haystack, needle) {\n    if (needle === "") return 0;\n    for (let i = 0; i &lt;= haystack.length - needle.length; i++) {\n        let match = true;\n        for (let j = 0; j &lt; needle.length; j++) {\n            if (haystack[i + j] !== needle[j]) { match = false; break; }\n        }\n        if (match) return i;\n    }\n    return -1;\n};</code></pre>'+
      '<h4>④ JS 偷懒解法</h4><pre><code>// 实际开发直接用 indexOf\nhaystack.indexOf(needle);</code></pre>'+
      '<div class="gain"><b>收获：</b>面试要求手写匹配逻辑（不让用 indexOf），暴力法要会；KMP 是进阶，先掌握 next 数组原理。</div>'
  },
  {
    num: '35', title: '搜索插入位置', date: '2026-08-11',
    tags: ['二分查找','数组','简单'],
    link: '',
    body:
      '<h4>① 题目理解</h4><p>给定升序数组 nums 和目标值 target，找到 target 则返回下标，找不到则返回它应该插入的位置（保持有序）。</p>'+
      '<h4>② 思路：二分查找</h4><p>标准二分，区别在于找不到时返回 left（即第一个 ≥ target 的位置）。</p>'+
      '<h4>③ 代码</h4><pre><code>var searchInsert = function(nums, target) {\n    let left = 0, right = nums.length - 1;\n    while (left &lt;= right) {\n        let mid = Math.floor((left + right) / 2);\n        if (nums[mid] === target) return mid;\n        else if (nums[mid] &lt; target) left = mid + 1;\n        else right = mid - 1;\n    }\n    return left; // 插入位置\n};</code></pre>'+
      '<h4>④ 为什么返回 left</h4><div class="gain"><b>循环结束时 left &gt; right，left 正好指向第一个 ≥ target 的位置——就是该插入的地方。</b></div>'+
      '<h4>⑤ 复杂度</h4><p>时间 O(log n)，空间 O(1)。二分查找的经典入门题。</p>'
  }
];

// ============ 渲染橱窗 ============
var shop = document.getElementById('shop');
var html = '';
PROBLEMS.forEach(function(p, i){
  var tagsHtml = p.tags.map(function(t){ return '<span>'+t+'</span>'; }).join('');
  var linkHtml = p.link ? '<a class="sol-link" href="'+p.link+'" target="_blank" rel="noopener">我的 LeetCode 题解 →</a>' : '';
  html +=
    '<div class="shop-item" data-idx="'+i+'">'+
      '<span class="num">'+p.num+'</span>'+
      '<div class="ttl">'+p.title+'</div>'+
      '<div class="tags">'+tagsHtml+'</div>'+
      '<div class="date">'+(p.date||'')+'</div>'+
      '<span class="arrow">›</span>'+
    '</div>';
  // 缓存 body 和 link 供 modal 用
  p._fullBody = p.body + linkHtml;
});
shop.innerHTML = html;
document.getElementById('cnt').textContent = PROBLEMS.length;

// ============ Modal 详情 ============
var mask = document.getElementById('modalMask');
function openModal(i){
  var p = PROBLEMS[i];
  document.getElementById('mNum').textContent = p.num;
  document.getElementById('mTitle').textContent = p.title;
  document.getElementById('mBody').innerHTML = p._fullBody;
  mask.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  mask.classList.remove('open');
  document.body.style.overflow = '';
}
shop.addEventListener('click', function(e){
  var item = e.target.closest('.shop-item');
  if(item) openModal(parseInt(item.getAttribute('data-idx'),10));
});
document.getElementById('mClose').addEventListener('click', closeModal);
mask.addEventListener('click', function(e){ if(e.target === mask) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });
</script>

</body>
</html>

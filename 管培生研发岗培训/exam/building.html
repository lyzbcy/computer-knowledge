<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建设中 · 管培生研发岗培训</title>
<link rel="icon" href="../../Vue3/img/sticker/mascot.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF6EB;--paper:#F3EDDD;--forest:#1E3A24;--marker:#F5E08A;--brick:#B5482A;--font-display:"Archivo Black","Noto Sans SC","PingFang SC",sans-serif;--font-head:"Poppins","Noto Sans SC","PingFang SC",sans-serif;--font-body:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--cream);color:#1A2018;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.wrap{max-width:520px;}
.mascot{width:90px;height:90px;border-radius:50%;border:3px solid var(--marker);margin-bottom:1.2rem;}
h1{font-family:var(--font-display);font-size:1.6rem;color:var(--forest);margin-bottom:.5rem;}
.cat-name{display:inline-block;background:var(--marker);color:var(--forest);font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px;margin-bottom:1rem;}
.sub-name{font-family:var(--font-head);font-size:1.15rem;color:var(--brick);margin-bottom:.8rem;}
p{color:#5A5040;font-size:.95rem;line-height:1.8;margin-bottom:1.5rem;}
.progress{background:var(--paper);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;font-size:.85rem;color:#5A5040;text-align:left;}
.progress strong{color:var(--forest);}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--forest);color:var(--cream);text-decoration:none;font-weight:600;font-size:.9rem;padding:.6rem 1.4rem;border-radius:999px;font-family:var(--font-head);transition:opacity .2s;}
.back:hover{opacity:.85;}
.hint{margin-top:1.8rem;font-size:.8rem;color:#9A8E64;}
</style>
</head>
<body>
<div class="wrap">
  <img class="mascot" src="../../Vue3/img/sticker/mascot.png" alt="捞鱼">
  <h1 id="h1">🚧 内容建设中</h1>
  <div id="catTag" class="cat-name">分类</div>
  <div id="subName" class="sub-name">章节</div>
  <p id="desc">这一章的学习内容正在筹备中，还未上线。<br>完成后会更新到这里，并开放对应的 8 月知识考试。</p>
  <div class="progress" id="prog">
    📦 <strong>当前进度</strong>：通识 6 章已全部上线，<strong>通识综合考试</strong>已开放。<br>
    其它方向（前端 / 后端 / 大数据 / AI / 基线）的内容正在按计划推进，敬请期待。
  </div>
  <a class="back" href="../index.html">← 返回学习地图</a>
  <div class="hint">提示：8 月为学习考试阶段，七大方向各一套知识考试，9 月为实操项目考试</div>
</div>
<script>
// 从 URL 参数读取分类、章节、类型
var p = new URLSearchParams(location.search);
var cat = p.get('cat') || '该方向';
var sub = p.get('sub') || '该章节';
var type = p.get('type'); // exam = 考试筹备中；否则 = 学习内容建设中
document.getElementById('catTag').textContent = cat;
document.getElementById('subName').textContent = sub;
document.title = sub + ' · 建设中';
if(type === 'exam'){
  document.getElementById('h1').textContent = '📝 考试筹备中';
  document.getElementById('desc').innerHTML = '该方向的 <strong>8 月知识考试</strong> 正在筹备中，题目与复习范围整理好后会在这里开放。<br>现阶段请先学好对应章节的学习内容。';
  document.getElementById('prog').innerHTML = '📦 <strong>当前进度</strong>：<strong>通识综合考试</strong>已开放（27 题，自动判分）。<br>前端 / 后端 / 大数据 / AI / 测试 / 基线 六个方向的考试将陆续开放，敬请期待。';
}
</script>
</body>
</html>
